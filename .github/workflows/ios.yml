name: EAR unsigned IPA
on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ear-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with iOS 26 SDK
        run: python3 scripts/select_xcode.py
      - name: Compile unsigned iPhone app
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -version
          python3 scripts/bounded.py xcodebuild -project EAR.xcodeproj -scheme EAR -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CURRENT_PROJECT_VERSION=${{ github.run_number }} CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build 2>&1 | tee build/device.log
      - name: Package IPA
        run: |
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/EAR.app build/package/Payload/
          python3 - <<'PY'
          import json, os, plistlib
          app='build/package/Payload/EAR.app'
          info=plistlib.load(open(app+'/Info.plist','rb'))
          assert info['MinimumOSVersion']=='26.0'
          assert info['CFBundleIdentifier']=='com.aeon.ear'
          assert info['CFBundleShortVersionString']=='1.2'
          json.dump({'commit':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_NUMBER'],'unsigned':True},open(app+'/BuildManifest.json','w'),indent=2)
          PY
          cd build/package
          zip -q -r ../EAR-1.2-unsigned.ipa Payload
          cd ..
          shasum -a 256 EAR-1.2-unsigned.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EAR-unsigned-IPA
          path: |
            build/EAR-1.2-unsigned.ipa
            build/SHA256.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EAR-device-log
          path: build/device.log
  audio:
    needs: ipa
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: python3 scripts/select_xcode.py
      - name: Compile regression checks
        run: |
          set -o pipefail
          mkdir -p build
          python3 scripts/bounded.py xcrun swiftc -swift-version 6 EAR/Models.swift EAR/AudioAnalyzer.swift EAR/AudioFiles.swift EAR/NotebookFiles.swift EAR/Experiments.swift EAR/ProductionKnowledge.swift scripts/AudioCheck.swift -o build/audio-check 2>&1 | tee build/audio-compile.log
      - name: Check analysis, imports, cancellation and notebook recovery
        run: |
          set -o pipefail
          python3 scripts/bounded.py build/audio-check 2>&1 | tee build/audio-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EAR-audio-validation
          path: build/*.log
          retention-days: 14
  ui:
    needs: audio
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and simulator
        run: python3 scripts/select_xcode.py --simulator
      - name: Boot simulator
        run: |
          mkdir -p build
          set -o pipefail
          python3 scripts/bounded.py xcrun simctl bootstatus "$EAR_SIM" -b 2>&1 | tee build/boot.log
      - name: Build simulator tests
        run: |
          set -o pipefail
          python3 scripts/bounded.py xcodebuild -project EAR.xcodeproj -scheme EAR -configuration Debug -destination "platform=iOS Simulator,id=$EAR_SIM" -derivedDataPath build/simulator ONLY_ACTIVE_ARCH=YES build-for-testing 2>&1 | tee build/simulator-build.log
          codesign --verify --deep --strict build/simulator/Build/Products/Debug-iphonesimulator/EAR.app
          codesign -d --entitlements :- build/simulator/Build/Products/Debug-iphonesimulator/EAR.app > build/simulator-signing.log 2>&1
      - name: Native file import
        run: |
          set -o pipefail
          python3 scripts/bounded.py xcodebuild -project EAR.xcodeproj -scheme EAR -configuration Debug -destination "platform=iOS Simulator,id=$EAR_SIM" -derivedDataPath build/simulator -resultBundlePath build/Import.xcresult -only-testing:EARUITests/SmokeTests/testFilePickerImportsAudio -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 240 test-without-building 2>&1 | tee build/import-ui.log
      - name: Native file cancellation and recovery
        run: |
          set -o pipefail
          python3 scripts/bounded.py xcodebuild -project EAR.xcodeproj -scheme EAR -configuration Debug -destination "platform=iOS Simulator,id=$EAR_SIM" -derivedDataPath build/simulator -resultBundlePath build/Recovery.xcresult -only-testing:EARUITests/SmokeTests/testFilePickerCancelReopenInvalid -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 240 test-without-building 2>&1 | tee build/recovery-ui.log
      - name: Native listening and Lab
        run: |
          set -o pipefail
          python3 scripts/bounded.py xcodebuild -project EAR.xcodeproj -scheme EAR -configuration Debug -destination "platform=iOS Simulator,id=$EAR_SIM" -derivedDataPath build/simulator -resultBundlePath build/Smoke.xcresult -skip-testing:EARUITests/SmokeTests/testFilePickerImportsAudio -skip-testing:EARUITests/SmokeTests/testFilePickerCancelReopenInvalid -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 240 test-without-building 2>&1 | tee build/smoke.log
      - name: Collect import and playback diagnostics
        if: always()
        run: |
          mkdir -p build
          python3 scripts/bounded.py xcrun simctl spawn "$EAR_SIM" log show --last 20m --info --style compact --predicate 'subsystem == "com.aeon.ear" OR subsystem CONTAINS[c] "fileprovider" OR subsystem CONTAINS[c] "documentmanager"' > build/runtime-diagnostics.log 2>&1 || true
      - name: Collect screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          if [ -f build/Import.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/Import.xcresult --output-path build/screenshots/import || true
          fi
          if [ -f build/Recovery.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/Recovery.xcresult --output-path build/screenshots/recovery || true
          fi
          if [ -f build/Smoke.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/Smoke.xcresult --output-path build/screenshots || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EAR-native-validation
          path: |
            build/*.log
            build/screenshots
          retention-days: 14
